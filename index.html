<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Ehl-i Kebap · Türkische Grillküche in Berlin</title>
  <meta name="theme-color" content="#0b0c0d">
  <link rel="icon" href="assets/img/emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;600&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b0c0d; --ink: #efe7da; --mute: #a59f95; --gold: #c9a46b; --line: rgba(201, 164, 107, .38); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(60% 50% at 50% 40%, #191a1c, var(--bg)); color: var(--ink); font-family: "Cormorant Garamond", Georgia, serif; }
    .gate { width: min(340px, 100%); text-align: center; transition: opacity .4s; }
    .gate.is-auto { opacity: 0; pointer-events: none; }
    .gate img { width: 76px; height: auto; }
    h1 { margin: 22px 0 6px; padding-left: .32em; font: 300 21px/1.2 "Josefin Sans", system-ui, sans-serif; letter-spacing: .32em; text-transform: uppercase; }
    .sub { margin: 0 0 30px; color: var(--mute); font-style: italic; font-size: 19px; }
    .feld { position: relative; }
    .feld input { width: 100%; padding: 16px 64px 16px 16px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 0;
      color: var(--ink); font: 300 18px/1 "Josefin Sans", system-ui, sans-serif; letter-spacing: .1em; -webkit-appearance: none; appearance: none; }
    .feld input:focus { outline: none; border-color: var(--gold); }
    .feld button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 10px; background: none; border: 0; color: var(--mute);
      font: 600 10px "Josefin Sans", system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; }
    .los { width: 100%; margin-top: 14px; padding: 17px; background: var(--gold); border: 0; color: #0b0c0d; cursor: pointer;
      font: 600 12px "Josefin Sans", system-ui, sans-serif; letter-spacing: .34em; text-transform: uppercase; }
    .los:disabled { opacity: .6; cursor: wait; }
    .merk { display: inline-flex; gap: 10px; align-items: center; margin-top: 20px; color: var(--mute); font-size: 17px; cursor: pointer; }
    .merk input { width: 18px; height: 18px; accent-color: var(--gold); margin: 0; }
    .fehler { min-height: 26px; margin: 14px 0 0; color: #e3907f; font-size: 17px; }
  </style>
</head>
<body>

  <main class="gate is-auto" id="gate">
    <img src="assets/img/emblem.png" alt="Ehl-i Kebap">
    <h1>Ehl-i Kebap</h1>
    <p class="sub">Bitte Passwort eingeben</p>
    <form id="form">
      <input type="text" name="username" value="ehli-kebap" autocomplete="username" hidden>
      <div class="feld">
        <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passwort" aria-label="Passwort" required>
        <button type="button" id="zeigen" aria-label="Passwort anzeigen">Zeigen</button>
      </div>
      <button class="los" id="los" type="submit">Öffnen</button>
      <label class="merk"><input type="checkbox" id="merk"> Auf diesem Gerät merken</label>
      <p class="fehler" id="fehler" role="alert"></p>
    </form>
  </main>

      const SCHLUESSEL = "ehli-kebap-schluessel";
      const $ = (id) => document.getElementById(id);
      const gate = $("gate"), pw = $("pw"), los = $("los"), fehler = $("fehler");
      const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const zuB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
      const lies = (s) => { try { return s.getItem(SCHLUESSEL); } catch (e) { return null; } };
      const merke = (s, v) => { try { v ? s.setItem(SCHLUESSEL, v) : s.removeItem(SCHLUESSEL); } catch (e) { /* privates Fenster */ } };

      async function entschluessle(raw) {
        const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
        const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.iv) }, key, b64(D.daten));
        return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
      }
      function zeige(html) { document.open(); document.write(html); document.close(); }
      function formular() { gate.classList.remove("is-auto"); if (!matchMedia("(pointer: coarse)").matches) pw.focus(); }

      if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
        formular(); los.disabled = true;
        fehler.textContent = "Dieser Browser ist zu alt. Bitte Safari, Chrome oder Firefox aktualisieren.";
        return;
      }

      // schon entsperrt (dieser Tab) oder auf dem Gerät gemerkt: direkt öffnen
      const gespeichert = lies(sessionStorage) || lies(localStorage);
      if (gespeichert) {
        entschluessle(b64(gespeichert)).then((html) => { merke(sessionStorage, gespeichert); zeige(html); })
          .catch(() => { merke(sessionStorage); merke(localStorage); formular(); });
      } else formular();

      $("zeigen").addEventListener("click", () => {
        const an = pw.type === "password";
        pw.type = an ? "text" : "password";
        $("zeigen").textContent = an ? "Verbergen" : "Zeigen";
      });
      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        los.disabled = true; los.textContent = "Prüfe"; fehler.textContent = "";
        try {
          const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.value), "PBKDF2", false, ["deriveBits"]);
          const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(D.salt), iterations: D.iter, hash: "SHA-256" }, basis, 256);
          const html = await entschluessle(bits);
          const s = zuB64(bits);
          merke(sessionStorage, s);
          if ($("merk").checked) merke(localStorage, s);
          zeige(html);
        } catch (err) {
          fehler.textContent = "Das Passwort stimmt nicht.";
          los.disabled = false; los.textContent = "Öffnen"; pw.select();
        }
      });
    })();
